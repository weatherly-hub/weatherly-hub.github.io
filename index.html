<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly - Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-page">

        <header class="hero">
            <div class="hero-content">
                <h1>🌤️ Weatherly</h1>
                <p class="subtitle">Real-Time Weather Dashboard</p>

                <div class="search-box">
                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Enter city name"
                        onkeydown="if(event.key==='Enter') getWeather()"
                    >

                    <button onclick="getWeather()">Search</button>

                    <button id="unitButton" onclick="toggleUnit()">
                        Switch to °F
                    </button>
                </div>
            </div>
        </header>

        <main>

            <section class="current-weather">

                <h2 id="city">City Name</h2>

                <p id="dateTime">Last Updated: --</p>

                <div class="weather-cards">

                    <div class="weather-card" id="condition">
                        🌤️ Weather Condition
                    </div>

                    <div class="weather-card" id="temperature">
                        🌡️ Temperature: -- °C
                    </div>

                    <div class="weather-card" id="humidity">
                        💧 Humidity: -- %
                    </div>

                    <div class="weather-card" id="feelsLike">
                        🤗 Feels Like: -- °C
                    </div>

                    <div class="weather-card" id="wind">
                        💨 Wind Speed: -- km/h
                    </div>

                </div>

            </section>


            <section class="chart-container">

                <h2>Temperature Forecast</h2>

                <canvas id="temperatureChart"></canvas>

            </section>


            <section class="chart-container">

                <h2>Wind Speed Forecast</h2>

                <canvas id="windChart"></canvas>

            </section>


            <section class="forecast-section">

                <h2>5-Day Forecast</h2>

                <div id="forecast"></div>

            </section>

        </main>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
